name: Navigation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app.js"
      - "styles.css"
      - "accounts.js"
      - "i18n/**"
      - "scripts/bottom_nav_test.mjs"
      - "scripts/home_reach_test.mjs"
      - "scripts/profile_tabs_order_test.js"
      - "scripts/profile_tabs_test.mjs"
      - "scripts/nav_custom_test.js"
      - "scripts/dock_test.js"
      - "scripts/landscape_layout_test.mjs"
      - "scripts/phone_resize_test.mjs"
      - "scripts/profile_layout_test.mjs"
      - "scripts/menu_pages_test.mjs"
      - "scripts/ios_webkit_test.mjs"
      - "shared/ios.js"
      - "index.html"
      - "dock.js"
      - "dock.css"
      - "worker/**"
      - ".github/workflows/nav-custom.yml"
  push:
    branches:
      - main
    paths:
      - "app.js"
      - "styles.css"
      - "accounts.js"
      - "i18n/**"
      - "scripts/bottom_nav_test.mjs"
      - "scripts/home_reach_test.mjs"
      - "scripts/profile_tabs_order_test.js"
      - "scripts/profile_tabs_test.mjs"
      - "scripts/nav_custom_test.js"
      - "scripts/dock_test.js"
      - "scripts/landscape_layout_test.mjs"
      - "scripts/phone_resize_test.mjs"
      - "scripts/profile_layout_test.mjs"
      - "scripts/menu_pages_test.mjs"
      - "scripts/ios_webkit_test.mjs"
      - "shared/ios.js"
      - "index.html"
      - "dock.js"
      - "dock.css"
      - "worker/**"
      - ".github/workflows/nav-custom.yml"

# A new push to a pull request cancels that pull request's older run, so
# superseded commits stop holding runners. Pushes to main never cancel each
# other (one group per run).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  navshard:
    name: nav-${{ matrix.shard }}
    runs-on: ${{ matrix.shard == 'nav-pages' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [nav-reach, nav-shell, nav-layout, nav-pages]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('worker/package-lock.json') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
      - name: Navigation checks
        run: bash scripts/smoke-all.sh --suite nav --shard ${{ matrix.shard }}

  nav:
    needs: navshard
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every navigation shard passed
        run: |
          result="${{ needs.navshard.result }}"
          echo "navigation shards: $result"
          test "$result" = "success"
