name: Page smoke

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/smoke-docs.yml"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/smoke-docs.yml"
      - ".github/workflows/actions-cleanup.once"
      - ".github/workflows/actions-cleanup.yml"
      - "scripts/actions_cleanup.py"

# A new push to a pull request cancels that pull request's older run, so
# superseded commits stop holding runners. Pushes to main never cancel each
# other (one group per run).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  shard:
    name: shard-${{ matrix.shard }}
    runs-on: ${{ matrix.shard == 'site' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [checks, site, sw, ui-fast, ui-profile, ui-drawer, home, compose-core, compose-a, compose-b, compose-c, compose-d, compose-e, signup-flows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Cache Playwright browsers
        if: matrix.shard != 'checks'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('worker/package-lock.json') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-

      - name: Cache worker modules
        if: startsWith(matrix.shard, 'signup')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: worker/node_modules
          key: worker-modules-${{ runner.os }}-${{ hashFiles('worker/package-lock.json') }}

      - name: Chrome
        run: |
          if ! command -v google-chrome >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          google-chrome --version

      - name: Run shard
        run: bash scripts/smoke-all.sh --shard ${{ matrix.shard }}

  # The required check stays named smoke. It passes only when every shard passed.
  smoke:
    name: smoke
    needs: shard
    if: always() && !cancelled() && needs.shard.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        run: |
          result="${{ needs.shard.result }}"
          echo "shard result: $result"
          test "$result" = "success"
