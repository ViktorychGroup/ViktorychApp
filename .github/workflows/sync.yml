name: Sync feeds

on:
  schedule:
    # Half-hour sync also publishes the site through the reusable Publish app
    # workflow. Direct app pushes do not start a feed refresh.
    # GitHub often drops one of these slots, so the staggered line is a backup.
    - cron: "*/30 * * * *"
    - cron: "15,45 * * * *"
    # Once a day, squash the data branch. This does not upload to archive.org.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: manual
        required: false
        default: manual

# Feed refresh and app publishing start together after the gate. They do not
# wait for one another; both workflows use the shared Pages concurrency locks.

# The backup job needs contents: write. The build job narrows that back to read.
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
  issues: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ github.event.inputs.source }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          go = "true"
          event = os.environ.get("EVENT") or ""
          source = os.environ.get("SOURCE") or ""
          # A manual dispatch always publishes. Schedule and the
          # keepalive chain skip when another sync already started recently,
          # so the two cron lines cannot pile up.
          schedule = os.environ.get("SCHEDULE") or ""
          if schedule == "17 6 * * *":
              pass
          elif event in ("schedule",) or (event == "workflow_dispatch" and source == "chain"):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/sync.yml/runs?per_page=10",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "feeds-sync",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as res:
                  data = json.load(res)
              now = datetime.now(timezone.utc)
              me = os.environ.get("RUN_ID") or ""
              for run in data.get("workflow_runs") or []:
                  if str(run.get("id")) == me:
                      continue
                  if run.get("status") == "completed" and run.get("conclusion") not in ("success", "skipped"):
                      continue
                  if run.get("status") not in ("in_progress", "queued", "waiting", "pending", "completed"):
                      continue
                  started = run.get("run_started_at") or run.get("created_at") or ""
                  if not started:
                      continue
                  dt = datetime.fromisoformat(started.replace("Z", "+00:00"))
                  if (now - dt).total_seconds() < 22 * 60:
                      print(f"skip; run {run.get('id')} started {started}")
                      go = "false"
                      break
          print(f"go={go}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"go={go}\n")
          PY

  publish-app:
    name: Publish app
    needs: gate
    if: needs.gate.outputs.go == 'true'
    uses: ./.github/workflows/publish-app.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
      issues: write
    with:
      source: ${{ github.event.inputs.source }}

  # Feed refresh does not block Pages. One slow source is skipped, and the
  # catalog is written to R2 so the app can read it without another deploy.
  refresh:
    needs: gate
    if: needs.gate.outputs.go == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: feed-refresh
      cancel-in-progress: true
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Restore the pip cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py312-feeds-${{ hashFiles('scripts/update_feeds.py', 'scripts/tiktok_sync.py') }}
          restore-keys: |
            pip-${{ runner.os }}-py312-feeds-
            pip-${{ runner.os }}-py312-

      - name: Start local feed services
        env:
          INSTAGRAM_COOKIE: ${{ secrets.IG_SESSION }}
          IG_COOKIE: ${{ secrets.IG_SESSION }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
        run: |
          docker run -d --rm --name rsshub -p 1200:1200 \
            -e INSTAGRAM_COOKIE -e IG_COOKIE -e TWITTER_AUTH_TOKEN \
            diygod/rsshub
          docker run -d --rm --name rssbridge -p 8080:80 rssbridge/rss-bridge

      - name: Wait for local feed services
        run: |
          python3 - <<'PY'
          import socket, time
          def open_port(port):
              sock = socket.socket()
              sock.settimeout(2)
              try:
                  sock.connect(("127.0.0.1", port))
                  return True
              except OSError:
                  return False
              finally:
                  sock.close()
          for label, port in (("rsshub", 1200), ("rss-bridge", 8080)):
              ready = False
              for _ in range(20):
                  if open_port(port):
                      ready = True
                      break
                  time.sleep(2)
              print(f"{label} {'ready' if ready else 'not ready; later fallbacks will be tried'}")
          PY

      - name: Copy the live catalog into R2 before refresh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/catalog_migrate.py --catalog-only

      - name: Pull the last published snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 scripts/r2_catalog.py pull
          python3 scripts/pull_snapshot.py

      - name: Restore the VK browser
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1-${{ runner.os }}

      - name: Restore the VK session cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vk-session
          key: vk-web-session-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vk-web-session-

      - name: Install the VK browser
        env:
          VK_LOGIN: ${{ secrets.VK_LOGIN }}
          VK_SESSION: ${{ secrets.VK_SESSION }}
        run: |
          if [ -z "${VK_LOGIN:-}" ] && [ -z "${VK_SESSION:-}" ]; then
            echo "VK web session is off"
            exit 0
          fi
          if [ -n "${VK_LOGIN:-}" ]; then
            echo "::add-mask::${VK_LOGIN}"
          fi
          python3 -m pip install --disable-pip-version-check -q playwright
          python3 -m playwright install --with-deps chromium

      - name: Refresh feeds
        env:
          FEED_DEADLINE_SECONDS: "360"
          PYTHONUNBUFFERED: "1"
          INSTAGRAM_COOKIE: ${{ secrets.INSTAGRAM_COOKIE }}
          THREADS_COOKIE: ${{ secrets.THREADS_COOKIE }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          X_PROXY_BASE: ${{ vars.X_PROXY_BASE }}
          X_PROXY_TOKEN: ${{ secrets.X_PROXY_TOKEN }}
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          IG_SESSION: ${{ secrets.IG_SESSION }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_LOGIN: ${{ secrets.VK_LOGIN }}
          VK_PASSWORD: ${{ secrets.VK_PASSWORD }}
          VK_TOTP_SECRET: ${{ secrets.VK_TOTP_SECRET }}
          VK_SESSION: ${{ secrets.VK_SESSION }}
          VK_SESSION_KEY: ${{ secrets.VK_SESSION_KEY }}
          VK_SESSION_FILE: ${{ github.workspace }}/.vk-session/cookies.enc
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STORIES_SESSION: ${{ secrets.TG_STORIES_SESSION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TIKTOK_BUDGET: "1"
          TIKTOK_BUDGET_SECONDS: "180"
          TIKTOK_TRACKED: ${{ secrets.TIKTOK_TRACKED }}
          TIKTOK_UNLOCKED: ${{ secrets.TIKTOK_UNLOCKED }}
          WORKER_DISPATCH_TOKEN: ${{ secrets.WORKER_DISPATCH_TOKEN }}
          ACCOUNTS_API: ${{ vars.ACCOUNTS_API }}
        run: |
          if [ -n "${DISCORD_USER_TOKEN:-}" ]; then
            echo "::add-mask::${DISCORD_USER_TOKEN}"
          fi
          if [ -n "${IG_SESSION:-}" ]; then
            echo "::add-mask::${IG_SESSION}"
          fi
          if [ -n "${VK_USER_TOKEN:-}" ]; then
            echo "::add-mask::${VK_USER_TOKEN}"
          fi
          if [ -n "${VK_LOGIN:-}" ]; then
            echo "::add-mask::${VK_LOGIN}"
          fi
          if [ -n "${VK_PASSWORD:-}" ]; then
            echo "::add-mask::${VK_PASSWORD}"
          fi
          if [ -n "${VK_TOTP_SECRET:-}" ]; then
            echo "::add-mask::${VK_TOTP_SECRET}"
          fi
          if [ -n "${VK_SESSION_KEY:-}" ]; then
            echo "::add-mask::${VK_SESSION_KEY}"
          fi
          if [ -n "${TG_STORIES_SESSION:-}" ]; then
            echo "::add-mask::${TG_STORIES_SESSION}"
          fi
          if [ -n "${TG_API_HASH:-}" ]; then
            echo "::add-mask::${TG_API_HASH}"
          fi
          if [ -n "${TG_STORIES_SESSION:-}" ] && [ -n "${TG_API_ID:-}" ] && [ -n "${TG_API_HASH:-}" ]; then
            timeout --kill-after=10s 40 python3 -m pip install --disable-pip-version-check -q telethon || echo "[telegram-stories] client install failed; the previous copy stays"
          fi
          if [ -n "${TIKTOK_TRACKED:-}${TIKTOK_UNLOCKED:-}" ]; then
            python3 - <<'PY'
          import os, re, sys
          raw = (os.environ.get("TIKTOK_TRACKED") or "") + "\n" + (os.environ.get("TIKTOK_UNLOCKED") or "")
          for part in re.split(r"[\s,]+", raw):
              if part:
                  sys.stdout.write("::add-mask::" + part + "\n")
          PY
          fi
          python3 - <<'PY'
          import json, os, re
          value = os.environ.get("VK_SESSION") or ""
          for line in value.splitlines():
              line = line.strip()
              if line:
                  print("::add-mask::" + line, flush=True)
          rows = None
          try:
              data = json.loads(value) if value else None
          except json.JSONDecodeError:
              data = None
          if isinstance(data, list):
              rows = data
          elif isinstance(data, dict):
              rows = data.get("cookies")
          if isinstance(rows, list):
              for row in rows:
                  if isinstance(row, dict) and row.get("value"):
                      print("::add-mask::" + str(row["value"]), flush=True)
          else:
              for match in re.finditer(r"[^=;\s]+=([^;\s]+)", value):
                  print("::add-mask::" + match.group(1), flush=True)
          PY
          set +e
          # The job cap is 15 minutes. Stop each command with time left so the
          # catalog push still runs when a source or yt-dlp ignores its budget.
          timeout --kill-after=20s 400 python3 scripts/update_feeds.py
          feeds=$?
          if [ "$feeds" -eq 124 ]; then
            echo "[refresh] feed updater hit its clock; keeping posts fetched so far"
          fi
          timeout --kill-after=20s 60 python3 -m pip install --disable-pip-version-check -q 'yt-dlp==2026.10.21'
          timeout --kill-after=20s 190 python3 scripts/tiktok_sync.py
          tiktok=$?
          if [ "$tiktok" -eq 124 ]; then
            echo "[refresh] tiktok sync hit its clock"
          fi
          timeout --kill-after=20s 90 python3 scripts/r2_catalog.py push
          push=$?
          if [ "$feeds" -ne 0 ] && [ "$feeds" -ne 124 ]; then
            echo "[refresh] feed updater exited $feeds; unchanged sources keep their last posts"
          fi
          if [ "$push" -ne 0 ]; then
            echo "[refresh] catalog push exited $push"
            exit 1
          fi
          exit 0

      - name: Save the VK session cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vk-session
          key: vk-web-session-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the sync report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sync-report
          path: sync-report.json
          if-no-files-found: ignore
          retention-days: 1

  save-auto-feeds:
    needs: refresh
    if: needs.refresh.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Leave added accounts in private storage
        run: echo "added accounts stay in R2; feeds.config.json is not committed"

  # stories.json stays in R2. publish-stories does not commit it or upload it.
  publish-stories:
    needs: [gate, refresh]
    if: needs.gate.outputs.go == 'true' && needs.refresh.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Leave stories in private storage
        run: echo "stories.json stays in R2; publish-stories does not commit it"

  backup:
    needs: [refresh, publish-stories]
    if: always() && github.event_name == 'schedule' && github.event.schedule == '17 6 * * *' && needs.refresh.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check Cloudflare R2 usage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/r2_usage.py

      - name: Leave archive stubs in private storage
        run: echo "archive stubs stay in R2; the data branch is not updated"

  # One issue for a failed sync or a source that has returned nothing for six
  # hours. App publishing has its own alert in the reusable Publish app workflow.
  alert:
    needs: [gate, refresh]
    if: always() && needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: sync-report
          path: .

      - name: Open or close the sync problem
        env:
          BUILD_RESULT: skipped
          DEPLOY_RESULT: skipped
          ACCOUNTS_RESULT: skipped
          REFRESH_RESULT: ${{ needs.refresh.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_health.py

  # Start the Telegram upload from this run. workflow_run can miss a chained
  # start, so the backup is started here with workflow_dispatch.
  queue-telegram:
    needs: [gate, refresh]
    if: needs.gate.outputs.go == 'true' && needs.refresh.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
    steps:
      - name: Queue Telegram backup and media extract
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dispatch() {
            local workflow="$1"
            local body="$2"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/workflows/${workflow}/dispatches" \
              -d "$body"
          }
          dispatch telegram-backup.yml '{"ref":"main","inputs":{"loop_only":"false"}}'
          dispatch media-extract.yml '{"ref":"main","inputs":{"cap":"80"}}'
          dispatch reddit.yml '{"ref":"main"}'


