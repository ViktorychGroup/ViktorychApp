name: Publish app

on:
  push:
    branches:
      - main
    paths-ignore:
      # Community and catalog commits are data. The app reads them from R2,
      # so they must not start a Pages deploy. Cleanup marker pushes are not deploys.
      - "data/communities/**"
      - "feeds.json"
      - "stories.json"
      - "people.json"
      - "suggestions.json"
      - ".github/workflows/actions-cleanup.once"
      - ".github/workflows/actions-cleanup.yml"
      - "scripts/actions_cleanup.py"
  workflow_dispatch:
    inputs:
      source:
        description: manual
        required: false
        default: manual
  workflow_call:
    inputs:
      source:
        description: manual
        required: false
        default: manual
        type: string

# App pushes run this workflow directly. Sync feeds calls the same jobs for
# scheduled/manual publishing, so app updates never depend on feed refreshing.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  issues: write

jobs:
  # Pages must not publish while this commit's Accounts worker is still
  # deploying. Health was down for the whole previous retry window when the
  # two workflows started together, and the site shipped without the wall.
  wait-accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for this commit's Accounts deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request

          ACTIVE = {"queued", "in_progress", "waiting", "pending", "requested", "action_required"}
          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          sha = os.environ["SHA"]

          def get(path):
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "feeds-sync",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as res:
                  return json.load(res)

          def runs():
              data = get(f"/repos/{repo}/actions/workflows/accounts.yml/runs?head_sha={sha}&per_page=20")
              return data.get("workflow_runs") or []

          def touches():
              try:
                  commit = get(f"/repos/{repo}/commits/{sha}")
              except (urllib.error.URLError, TimeoutError, OSError, json.JSONDecodeError, KeyError):
                  return None
              files = commit.get("files")
              if not isinstance(files, list) or len(files) >= 300:
                  return None
              for item in files:
                  name = str(item.get("filename") or "")
                  if name.startswith("worker/") or name.startswith("shared/") or name == ".github/workflows/accounts.yml":
                      return True
              return False

          def verdict(run):
              status = run.get("status") or ""
              if status != "completed":
                  return None
              try:
                  listed = get(f"/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=20")
              except (urllib.error.URLError, TimeoutError, OSError, json.JSONDecodeError, KeyError):
                  return None
              deploy = next((job for job in listed.get("jobs") or [] if job.get("name") == "deploy"), None)
              if deploy is None:
                  conclusion = run.get("conclusion") or ""
                  if conclusion == "success":
                      print(f"accounts run {run.get('id')} succeeded")
                      return 0
                  print(f"accounts run {run.get('id')} {conclusion}; refusing to publish Pages")
                  return 1
              if (deploy.get("status") or "") in ACTIVE or deploy.get("status") != "completed":
                  return None
              if deploy.get("conclusion") == "success":
                  print(f"accounts deploy {run.get('id')} succeeded")
                  return 0
              print(f"accounts deploy {run.get('id')} {deploy.get('conclusion')}; refusing to publish Pages")
              return 1

          grace = time.monotonic() + 90
          finish = None
          while True:
              try:
                  found = runs()
              except urllib.error.HTTPError as exc:
                  print(f"accounts run list HTTP {exc.code}")
                  found = None
              except (urllib.error.URLError, TimeoutError, OSError, json.JSONDecodeError):
                  print("accounts run list unavailable")
                  found = None
              run = found[0] if found else None
              if run is not None:
                  code = verdict(run)
                  if code is not None:
                      raise SystemExit(code)
                  if finish is None:
                      finish = time.monotonic() + 15 * 60
                  if time.monotonic() > finish:
                      print(f"accounts run {run.get('id')} did not finish; refusing to publish Pages")
                      raise SystemExit(1)
                  print(f"waiting for accounts run {run.get('id')} ({run.get('status')})")
                  time.sleep(10)
                  continue
              if found == []:
                  changed = touches()
                  if changed is False:
                      print("this commit does not deploy the Accounts worker; Pages continues")
                      raise SystemExit(0)
              if time.monotonic() >= grace:
                  print(f"no Accounts run for {sha}; Pages continues")
                  raise SystemExit(0)
              time.sleep(5)
          PY

  build:
    needs: wait-accounts
    concurrency:
      group: pages-build
      # A running deploy on main is never cancelled; a newer run waits, then deploys the latest.
      cancel-in-progress: false
    timeout-minutes: 12
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      # One name per run attempt, so a rerun never finds two artifacts.
      pages_artifact: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    # The feed refresh is a separate job. This job only publishes the shell.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A run that waited in the queue still ships main's current app shell,
      # so an older run can never publish stale files or version.json.
      - name: Build from the latest main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/pages_guard.py pick-head
          sha="$(grep '^sha=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2)"
          if [ -n "$sha" ] && [ "$sha" != "$GITHUB_SHA" ]; then git checkout --quiet --detach "$sha"; fi
          git log -1 --format='building %h'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check interface strings
        run: python3 scripts/check_i18n.py

      - name: Assemble the site and check its size
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          if [ -n "${BUILD_SHA:-}" ]; then export GITHUB_SHA="$BUILD_SHA"; fi
          rm -rf _site
          python3 scripts/assemble_site.py --site _site
          export VERSION_BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ -n "${GITHUB_SHA:-}" ]; then sed -i "s|__SW_VERSION__|${GITHUB_SHA}|g; s|__SW_BUILT__|${VERSION_BUILT}|g" _site/sw.js; fi
          mkdir -p version-next
          python3 scripts/write_version.py --out version-next/version.json
          python3 scripts/write_version.py --previous --out _site/version.json
          python3 scripts/share_pages.py --site _site
          python3 - <<'PY'
          import os
          import sys
          total = 0
          for dirpath, dirnames, files in os.walk("_site"):
              dirnames[:] = [name for name in dirnames if name != ".git"]
              for name in files:
                  total += os.path.getsize(os.path.join(dirpath, name))
          limit = 200 * 1024 * 1024
          print(f"artifact size: {total} bytes ({total / 1024 / 1024:.2f} MB)")
          if total > limit:
              print(f"ERROR: built site is {total} bytes ({total / 1024 / 1024:.2f} MB), over the 200 MB limit ({limit} bytes).", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Copy the live catalog into R2 before the shell switch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/catalog_migrate.py --catalog-only

      - name: Move app data behind sign-in when the API is ready
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNTS_API: ${{ vars.ACCOUNTS_API }}
          ACCOUNTS_BACKUP_API: ${{ vars.ACCOUNTS_BACKUP_API || secrets.ACCOUNTS_BACKUP_API || 'https://viktorych-backup.onrender.com' }}
          TURNSTILE_SITEKEY: ${{ secrets.TURNSTILE_SITEKEY }}
          OWNER_CLAIM_CODE: ${{ secrets.OWNER_CLAIM_CODE }}
          ACCOUNT_PEPPER: ${{ secrets.ACCOUNT_PEPPER }}
          ACCOUNT_DELETION_SALT: ${{ secrets.ACCOUNT_DELETION_SALT }}
        run: python3 scripts/accounts_publish.py --site _site --source . --preserve-remote

      - name: Stamp mirror origins
        run: python3 scripts/stamp_mirrors.py --site _site

      - name: Add Web Analytics when the existing token can
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/cf_web_analytics.py --site _site

      - name: Keep a copy for the Cloudflare Pages mirror
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cf-pages-site
          path: _site
          include-hidden-files: true
          retention-days: 1
          overwrite: true

      - name: Keep the version manifest until the assets are live
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: version-next
          path: version-next/version.json
          retention-days: 1
          overwrite: true

      - name: Record whether the login wall is on
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accounts-wall
          path: accounts-wall/on
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
          include-hidden-files: true

  # wrangler pages deploy publishes the same shell to viktorychapp.
  # A missing Pages permission skips this job's upload and leaves GitHub Pages up.
  pages-mirror:
    needs: build
    concurrency:
      group: cf-pages-mirror
      # A running deploy on main is never cancelled; a newer run waits, then deploys the latest.
      cancel-in-progress: false
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install wrangler
        working-directory: worker
        run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cf-pages-site
          path: _site

      - name: Chrome
        run: |
          if ! command -v google-chrome >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          google-chrome --version

      - name: Leave large files off the Pages upload
        run: python3 scripts/cf_pages_prepare.py --site _site --out _mirror

      - name: Load the Pages upload fresh and with old saved data
        run: node scripts/smoke_page.mjs --site _mirror

      - name: Deploy the Pages mirror
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUILD_SHA: ${{ needs.build.outputs.sha || github.sha }}
        run: GITHUB_SHA="$BUILD_SHA" python3 scripts/cf_pages_deploy.py --dir "$GITHUB_WORKSPACE/_mirror"

  deploy:
    needs: [build, wait-accounts]
    # One Pages lock for every job that publishes Pages (this deploy and
    # publish-version). Only these short jobs queue; builds, the feed refresh
    # and the mirror still run in parallel. Discord live checks the same jobs
    # through scripts/pages_guard.py before it publishes.
    concurrency:
      group: pages-deploy
      # A running deploy on main is never cancelled; a newer run waits, then deploys the latest.
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact || 'github-pages' }}

  verify-live:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Chrome
        run: |
          if ! command -v google-chrome >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          google-chrome --version

      - name: Fail if the live page is black or a script is missing
        # The Worker watchdog dispatches source=watchdog-force only after two
        # redeploys failed to publish version.json. That run publishes the
        # build that already passed its offline smoke check (pages-mirror).
        continue-on-error: ${{ inputs.source == 'watchdog-force' }}
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/smoke_page.mjs --url "${PAGE_URL:-https://viktorychgroup.github.io/ViktorychApp/}" --retry 18

  # Assets are already live. This job publishes version.json after that,
  # so a client cannot be told to update before the files exist.
  publish-version:
    needs: [verify-live, pages-mirror]
    if: always() && needs.verify-live.result == 'success' && (needs.pages-mirror.result == 'success' || needs.pages-mirror.result == 'skipped')
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install wrangler
        working-directory: worker
        run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cf-pages-site
          path: _site

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: version-next
          path: version-next

      - name: Publish the version manifest after the assets
        id: manifest
        run: |
          found=$(find version-next -name version.json -type f | head -n 1)
          test -n "$found"
          cp "$found" _site/version.json
          sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("sha") or "")' "$found")"
          echo "sha=${sha:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # A newer run may have put a newer shell live while this one waited
      # for the lock. Then this run does not put its older files back; the
      # newer run publishes its own version.json.
      - name: Check that no newer shell is live
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUILD_SHA: ${{ steps.manifest.outputs.sha }}
        run: python3 scripts/pages_guard.py superseded --sha "$BUILD_SHA" --url "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/sw.js"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.fresh.outputs.go != 'false'
        with:
          name: app-shell-version-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
          include-hidden-files: true

      - name: Deploy the version manifest
        id: deploy
        if: steps.fresh.outputs.go != 'false'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: app-shell-version-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy the version manifest to the Pages mirror
        if: steps.fresh.outputs.go != 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ steps.manifest.outputs.sha }}
        run: |
          python3 scripts/cf_pages_prepare.py --site _site --out _mirror
          python3 scripts/cf_pages_deploy.py --dir "$GITHUB_WORKSPACE/_mirror"

  # App publishing reports its own health. Feed/source health stays in Sync feeds.
  alert:
    needs: [build, deploy, wait-accounts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Open or close the publishing problem
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          ACCOUNTS_RESULT: ${{ needs.wait-accounts.result }}
          REFRESH_RESULT: skipped
          PROBLEM_TITLE: App publish problem
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_health.py
